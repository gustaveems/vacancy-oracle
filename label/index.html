<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VacancyOracle · Label Studio</title>
<style>
  :root{--bg:#0d0f14;--card:#161a23;--line:#242b3a;--text:#e8eaf0;--muted:#8b94a7;
        --red:#e60012;--green:#22c55e;--amber:#f59e0b;--blue:#3b82f6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif}
  header{display:flex;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
  h1{font-size:15px;margin:0;letter-spacing:.06em}
  .stat{font-size:12px;color:var(--muted)} .stat b{color:var(--text)}
  select,input,button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 11px;font-size:13px}
  button{cursor:pointer} button:hover{border-color:var(--blue)}
  .key-row{display:flex;gap:8px}
  main{padding:16px 18px;max-width:1240px;margin:0 auto}
  .row{display:grid;grid-template-columns:260px 1fr auto;gap:16px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card);align-items:center}
  .row.sel{outline:2px solid var(--blue)}
  .row.vacant{outline:2px solid var(--red)} .row.active-lbl{outline:2px solid var(--green)} .row.unknown-lbl{outline:2px solid var(--amber)}
  .addr .city{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .addr .street{font-weight:600}
  .addr .ll{font-size:11px;color:var(--muted);font-family:monospace}
  .sv{display:flex;gap:8px}
  .sv img{width:214px;height:150px;border-radius:8px;object-fit:cover;background:#0a0c10;border:1px solid var(--line)}
  .sv .miss{width:214px;height:150px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px}
  .acts{display:flex;flex-direction:column;gap:6px}
  .acts button{font-size:12px;font-weight:700;letter-spacing:.04em}
  .b1{background:var(--red);border:0;color:#fff}.b2{background:var(--green);border:0;color:#08240f}.b3{background:var(--amber);border:0;color:#241a00}
  .ext{font-size:11px;color:var(--blue);text-decoration:none}
  kbd{background:#000;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px}
  .hint{margin-left:auto;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>ORACLE LABEL STUDIO</h1>
  <span class="stat">labeled <b id="nDone">0</b>/<span id="nTotal">0</span></span>
  <select id="cityFilter"><option value="">all cities</option></select>
  <select id="showLabeled"><option value="hide">hide labeled</option><option value="show">show all</option></select>
  <div class="key-row">
    <input id="gsvKey" type="password" placeholder="Google Street View Static API key (stored locally)" style="width:300px" />
    <button id="saveKey">save</button>
  </div>
  <button id="exportCsv">⬇ export labels.csv</button>
  <span class="hint">↑/↓ navigate · <kbd>1</kbd> vacant · <kbd>2> occupied · <kbd>3</kbd> unclear</span>
</header>
<main id="list">loading candidates.csv…</main>

<script>
const KEY_LS = "vo_gsv_key", LABELS_LS = "vo_labels";
let rows = [], labels = JSON.parse(localStorage.getItem(LABELS_LS) || "{}");
let sel = 0;

const $ = (s) => document.querySelector(s);
const saveLabels = () => localStorage.setItem(LABELS_LS, JSON.stringify(labels));

function key() { return localStorage.getItem(KEY_LS) || ""; }
$("#gsvKey").value = key();
$("#saveKey").onclick = () => { localStorage.setItem(KEY_LS, $("#gsvKey").value.trim()); render(); };

function svUrl(lat, lng, heading) {
  return `https://maps.googleapis.com/maps/api/streetview?size=428x300&location=${lat},${lng}&heading=${heading}&pitch=8&key=${key()}`;
}
const HEADS = [0, 90, 180, 270];
const N = { "1": "vacant", "2": "occupied", "3": "unclear" };

async function load() {
  const res = await fetch("../data/candidates.csv");
  const text = await res.text();
  const lines = text.trim().split("\n").slice(1);
  rows = lines.map((l) => {
    const c = l.match(/("([^"]*)")|([^,]*)/g).map(x => (x.startsWith('"') ? x.slice(1, -1) : x.replace(/,$/, "")));
    const [city, pdok, addr, lat, lng] = c.filter(Boolean);
    return { city, pdok, addr, lat, lng };
  });
  const cities = [...new Set(rows.map(r => r.city))];
  $("#cityFilter").insertAdjacentHTML("beforeend", cities.map(c => `<option>${c}</option>`).join(""));
  $("#nTotal").textContent = rows.length;
  render();
}

function visible() {
  const cf = $("#cityFilter").value, hide = $("#showLabeled").value === "hide";
  return rows.filter(r => (!cf || r.city === cf) && (!hide || !labels[r.pdok]));
}

function render() {
  const vis = visible();
  if (sel >= vis.length) sel = 0;
  $("#nDone").textContent = Object.keys(labels).length;
  $("#list").innerHTML = vis.map((r, i) => {
    const lab = labels[r.pdok];
    const labName = { "1": "vacant", "2": "occupied", "3": "unclear" }[lab] || "";
    const strip = key()
      ? HEADS.map(h => `<img loading="lazy" src="${svUrl(r.lat, r.lng, h)}" onerror="this.outerHTML='<div class=miss>no imagery</div>'" alt="view">`).join("")
      : `<div class="miss" style="width:100%">enter a Street View API key (top right) — or label via external link</div>`;
    return `<div class="row ${i === sel ? "sel" : ""} ${labName ? labName + "-lbl" : ""}" data-i="${i}" data-id="${r.pdok}">
      <div class="addr">
        <div class="city">${r.city}${labName ? ` · <b style="color:var(--${{ "1": "red", "2": "green", "3": "amber" }[lab]})">${labName.toUpperCase()}</b>` : ""}</div>
        <div class="street">${r.addr}</div>
        <div class="ll">${r.lat}, ${r.lng}</div>
        <a class="ext" target="_blank" rel="noopener" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${r.lat},${r.lng}">open Street View ↗</a>
      </div>
      <div class="sv">${strip}</div>
      <div class="acts">
        <button class="b1" data-k="1">VACANT · 1</button>
        <button class="b2" data-k="2">OCCUPIED · 2</button>
        <button class="b3" data-k="3">UNCLEAR · 3</button>
      </div>
    </div>`;
  }).join("") || "<p>No unlabeled rows left — export and you're done for today.</p>";
}

function label(i, k) {
  const r = visible()[i]; if (!r) return;
  labels[r.pdok] = k;
  saveLabels();
  sel = Math.min(i + 1, visible().length - 1);
  render();
}

$("#list").addEventListener("click", (e) => {
  const b = e.target.closest("[data-k]");
  const row = e.target.closest(".row");
  if (!row) return;
  sel = +row.dataset.i;
  if (b) label(sel, b.dataset.k);
});
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const vis = visible();
  if (e.key === "ArrowDown") { sel = Math.min(sel + 1, vis.length - 1); render(); }
  if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); render(); }
  if (["1", "2", "3"].includes(e.key)) label(sel, e.key);
});
$("#cityFilter").onchange = () => { sel = 0; render(); };
$("#showLabeled").onchange = () => { sel = 0; render(); };

$("#exportCsv").onclick = () => {
  const head = "city,pdok_vbo,address,lat,lng,label";
  const lines = rows.filter(r => labels[r.pdok]).map(r =>
    [r.city, r.pdok, `"${r.addr}"`, r.lat, r.lng, labels[r.pdok]].join(","));
  const blob = new Blob([[head, ...lines].join("\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "labels.csv"; a.click();
};

load();
</script>
</body>
</html>
